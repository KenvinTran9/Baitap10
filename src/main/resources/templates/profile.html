<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JWT Nimbus - Ho so</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="dashboard">
    <header class="topbar">
        <div>
            <p class="eyebrow">JWT DA XAC THUC</p>
            <h1>Ho so nguoi dung</h1>
        </div>
        <button id="logout" class="outline compact">Dang xuat</button>
    </header>

    <p id="profile-message" class="message" role="status"></p>

    <section class="profile-grid">
        <article class="card profile-card">
            <div id="avatar" class="avatar">?</div>
            <div>
                <p class="eyebrow">NGUOI DUNG HIEN TAI</p>
                <h2 id="profile-name">Dang tai...</h2>
                <p id="profile-email" class="muted"></p>
                <span id="profile-role" class="badge"></span>
            </div>
        </article>

        <article class="card">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">API /users</p>
                    <h2>Danh sach nguoi dung</h2>
                </div>
                <span id="user-count" class="count">0</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Ho ten</th><th>Email</th><th>Quyen</th></tr></thead>
                    <tbody id="users-body"></tbody>
                </table>
            </div>
        </article>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
