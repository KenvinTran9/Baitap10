spring.application.name=jwt-nimbus-demo
server.port=8005

# H2 chay ngay, khong can cai MySQL.
spring.datasource.url=jdbc:h2:mem:jwt_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Secret duoc ma hoa Base64 va sau khi giai ma phai co it nhat 32 byte cho HS256.
# Gia tri mac dinh chi dung cho bai tap. Production phai dat bien moi truong JWT_SECRET_BASE64.
security.jwt.secret-key=${JWT_SECRET_BASE64:bXktZGVtby1qd3Qtc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXM=}
security.jwt.issuer=jwt-nimbus-demo
security.jwt.expiration-time=3600000

app.cors.allowed-origin=http://localhost:8005
